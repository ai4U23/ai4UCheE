[project]
name = "perry-engine"
version = "1.0.0"
description = "Deterministic Python ChE & PDF sidecar for Perry's Intelligent Workbench (FastAPI + PyMuPDF + ChEDL/CoolProp/SciPy/Pint)"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pymupdf>=1.24.0",
  "chemicals>=1.3.0",
  "fluids>=1.0.26",
  "ht>=1.0.6",
  "thermo>=0.4.0",
  "CoolProp>=6.6.0",
  "scipy>=1.14.0",
  "pint>=0.24.0",
  "pydantic>=2.10.0",
  "pytest>=8.3.0",
  "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "pdf", "solvers", "routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
