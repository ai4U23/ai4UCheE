# ChemEng PVU edition — container pair (plan 261111 phase 05).
# Networks: chemeng-internal (the pair talks to each other) + ai4upvu_default (external —
# perry-workbench reaches publish-mcp for the revocation feed).
# NOTE: the workbench MUST be on BOTH networks — the compose `networks:` key is exclusive;
# declaring only ai4upvu_default excludes the service from the default network where
# perry-engine lives, and the sidecar becomes unreachable by DNS (kongming 261111 caught the
# symptom: "Sidecar unreachable: fetch failed").
# Port: 3001 on the host (3000 was occupied by ai4upvu-monitoring-grafana).
services:
  perry-engine:
    build:
      context: ..
      dockerfile: Dockerfile.sidecar
    environment:
      PERRY_ENGINE_HOST: 0.0.0.0
      PERRY_ENGINE_PORT: "8001"
    volumes:
      - "/opt/chemeng-pvu/corpus/Perry's Chemical Engineers' Handbook, 9th Edition.pdf:/app/Perry's Chemical Engineers' Handbook, 9th Edition.pdf:ro"
    networks:
      - chemeng-internal
    restart: unless-stopped

  perry-workbench:
    build:
      context: ..
      args:
        VITE_BRAND: pvu
    depends_on:
      perry-engine:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      PERRY_SIDECAR_URL: http://perry-engine:8001
      DB_PATH: /data/perry_workbench.sqlite
    env_file:
      - /etc/ai4upvu/chemeng.env
    volumes:
      - sqlite-data:/data
    networks:
      - chemeng-internal
      - ai4upvu_default
    restart: unless-stopped

volumes:
  sqlite-data:

networks:
  chemeng-internal:
  ai4upvu_default:
    external: true
